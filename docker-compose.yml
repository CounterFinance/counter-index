# counter-index — full-stack Docker Compose
#
# Shows OpStream (data source) + an counter-index-based indexer running side by side.
# The "counter-index-indexer" service is a PLACEHOLDER — replace it with your own
# indexer app once it has a Dockerfile and entry point.
#
# ── SQLite (default — two separate DB files on a shared volume) ───────────────
#   Run from the Opnet-devs/ parent directory:
#     docker compose -f counter-index/docker-compose.yml up -d
#
# ── Postgres (bundled) ────────────────────────────────────────────────────────
#     docker compose -f counter-index/docker-compose.yml --profile postgres up -d
#
# ── Postgres (external — set OPSTREAM_DB_URL / COUNTERINDEX_DB_URL in .env) ───────
#     docker compose -f counter-index/docker-compose.yml up -d
#
# Directory layout assumed (run from Opnet-devs/ parent):
#   Opnet-devs/
#     OpStream/     — chain scanner
#     counter-index/     — this file lives here
#     MyIndexer/    — your indexer app (replace in the counter-index-indexer service)

services:

  # ── OpStream — scans blocks, writes to opstream.db ───────────────────────────
  opstream:
    build:
      context: ..                         # Opnet-devs/ parent (counter-index dep needs it)
      dockerfile: OpStream/Dockerfile
    image: opstream:latest
    container_name: opstream
    restart: unless-stopped
    env_file: ../OpStream/.env

    volumes:
      # SQLite data shared with counter-index-indexer below:
      - chain_data:/app/data
    # Postgres: remove the volume above and set OPSTREAM_DB_URL in env_file

    depends_on:
      postgres:
        condition: service_healthy
        required: false

    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/data/opstream.db || sleep 5"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ── counter-index-based indexer — reads opstream.db, writes counterindex.db ────────────
  #
  # REPLACE THIS SERVICE with your actual indexer app.
  # Steps:
  #   1. Create your indexer directory with a Dockerfile (see counter-index/Dockerfile).
  #   2. Update `build.dockerfile` to point at your indexer's Dockerfile.
  #   3. Set your env vars (OPSTREAM_DB_PATH, COUNTERINDEX_DB_PATH, etc.).
  #
  counter-index-indexer:
    build:
      context: ..                         # Opnet-devs/ parent
      dockerfile: counter-index/Dockerfile     # Replace with MyIndexer/Dockerfile
    image: counter-index-indexer:latest
    container_name: counter-index-indexer
    restart: unless-stopped
    # env_file: ../MyIndexer/.env         # Uncomment and point at your .env

    environment:
      # SQLite paths inside the container:
      OPSTREAM_DB_PATH: /app/data/opstream.db   # source — written by OpStream above
      COUNTERINDEX_DB_PATH:  /app/data/counterindex.db    # sink   — written by this indexer
      # Postgres: set these instead (counterindex_* prefix avoids table collisions):
      # OPSTREAM_DB_URL: postgres://opstream:secret@postgres:5432/opstream
      # COUNTERINDEX_DB_URL:  postgres://opstream:secret@postgres:5432/opstream

    volumes:
      - chain_data:/app/data              # Shared with opstream — reads opstream.db

    depends_on:
      opstream:
        condition: service_healthy

  # ── Bundled Postgres (optional — activate with --profile postgres) ──────────
  postgres:
    image: postgres:16-alpine
    container_name: counter-index-postgres
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB:       opstream
      POSTGRES_USER:     opstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opstream_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opstream -d opstream"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chain_data:       # Shared SQLite volume (opstream.db + counterindex.db)
  postgres_data:    # Postgres data (only used with --profile postgres)
